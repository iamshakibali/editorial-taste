<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — {{Brand}}</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .nf { min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;
          padding-block: var(--space-40); background: var(--bg-base); }
    .nf__body { display: flex; flex-direction: column; gap: var(--space-20); max-width: 640px; }
    .nf__code { color: var(--text-muted); }
  </style>
</head>
<body>
  <main class="nf container">
    <a class="logo" href="/" aria-label="{{Brand}} home">
      <svg viewBox="0 0 125 24" aria-hidden="true"><text x="0" y="20" fill="currentColor" font-family="Geist, sans-serif" font-weight="700" font-size="24" letter-spacing="-0.5">BRAND</text></svg>
    </a>
    <div class="nf__body">
      <span class="eyebrow nf__code">Error 404</span>
      <h1 class="h0">This page has moved, or never existed.</h1>
      <p class="body-lg muted">Check the address, or start again from the homepage.</p>
      <div class="btn-row">
        <a class="btn btn--primary btn--wide" href="/">Back to home</a>
        <a class="btn btn--secondary btn--wide" href="/#contact">Contact us</a>
      </div>
    </div>
    <span class="label-lg muted">© {{Year}} {{Brand}}</span>
  </main>
</body>
</html>
